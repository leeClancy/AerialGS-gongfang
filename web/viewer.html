<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>预览</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d11; color: #e8edf4; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    .bar {
      position: fixed; left: 16px; top: 16px;
      background: #14181f; border: 1px solid #2a3340;
      padding: 14px 16px; max-width: 320px; border-radius: 12px;
    }
    .bar b { display: block; font-size: 16px; }
    .muted { color: #8b97a8; margin-top: 6px; font-size: 12px; line-height: 1.45; }
    .bar button {
      margin-top: 12px; margin-right: 8px;
      border: 1px solid #2a3340; background: #1b212b; color: #e8edf4;
      padding: 7px 12px; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="bar">
    <b id="info">正在读取 PLY</b>
    <div class="muted">点精灵预览，不是精确椭球渲染。</div>
    <div class="muted">拖动旋转 · 滚轮缩放 · 右键平移</div>
    <button id="reset">复位</button>
    <button id="fs">全屏</button>
  </div>
  <canvas id="c"></canvas>
  <script src="/viewer.js?v=8"></script>
</body>
</html>
